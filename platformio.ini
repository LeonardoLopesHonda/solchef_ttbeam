[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.15
	adafruit/Adafruit GFX Library@^1.12.1
	milesburton/DallasTemperature@^4.0.4
	bblanchon/ArduinoJson@^7.4.2
	mikalhart/TinyGPSPlus@^1.1.0
